name: Release

# Startet mit einem Versions-Tag: git tag v0.2.0 && git push origin v0.2.0
# Der Tag muss zu __version__ in mp3org/__init__.py passen.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Abhängigkeiten
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Tests
        run: python -m unittest discover -s tests

      - name: Version prüfen
        id: version
        shell: pwsh
        run: |
          $version = python -c "import mp3org; print(mp3org.__version__)"
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME passt nicht zu Version $version" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: fpcalc holen
        shell: pwsh
        run: |
          gh release download v1.5.1 --repo acoustid/chromaprint --pattern "chromaprint-fpcalc-1.5.1-windows-x86_64.zip" --output fpcalc.zip
          Expand-Archive fpcalc.zip fpcalc
          New-Item -ItemType Directory -Force tools | Out-Null
          Get-ChildItem fpcalc -Recurse -Filter fpcalc.exe | Copy-Item -Destination tools\
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Programm bauen
        run: python -m PyInstaller --noconfirm --windowed --name MP3Organizer --add-binary "tools\fpcalc.exe;." app.py

      - name: Installer bauen
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          iscc "/DAppVersion=${{ steps.version.outputs.version }}" installer\mp3-organizer.iss

      - name: Release veröffentlichen
        shell: pwsh
        run: gh release create $env:GITHUB_REF_NAME "dist\MP3-Organizer-Setup-${{ steps.version.outputs.version }}.exe" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
