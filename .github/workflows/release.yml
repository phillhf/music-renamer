name: Release

# Startet mit einem Versions-Tag: git tag v0.2.0 && git push origin v0.2.0
# Der Tag muss zu __version__ in musicrenamer/__init__.py passen.
# Von Hand gestartet baut es nur und veröffentlicht nichts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Abhängigkeiten
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Tests
        run: python -m unittest discover -s tests

      - name: Version prüfen
        id: version
        shell: pwsh
        run: |
          $version = python -c "import musicrenamer; print(musicrenamer.__version__)"
          if ($env:GITHUB_REF_TYPE -eq "tag" -and "v$version" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME passt nicht zu Version $version" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: fpcalc holen
        shell: pwsh
        run: |
          gh release download v1.5.1 --repo acoustid/chromaprint --pattern "chromaprint-fpcalc-1.5.1-windows-x86_64.zip" --output fpcalc.zip
          Expand-Archive fpcalc.zip fpcalc
          New-Item -ItemType Directory -Force tools | Out-Null
          Get-ChildItem fpcalc -Recurse -Filter fpcalc.exe | Copy-Item -Destination tools\
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Inno Setup bereitstellen
        shell: pwsh
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Programm und Installer bauen
        shell: pwsh
        run: ./installer/build.ps1 -SkipTests

      - name: Fertiges Paket prüfen
        shell: pwsh
        run: |
          $test = Start-Process dist\MusicRenamer\MusicRenamer.exe -ArgumentList "--selftest" -Wait -PassThru
          if ($test.ExitCode -ne 0) { throw "Selbsttest fehlgeschlagen: $($test.ExitCode)" }
          dist\music-renamer-cli\music-renamer-cli.exe --selftest
          if ($LASTEXITCODE -ne 0) { throw "Selbsttest der Befehlszeile fehlgeschlagen: $LASTEXITCODE" }

      - name: Befehlszeile im Setup prüfen
        shell: pwsh
        run: |
          $setup = (Get-Item dist\Music-Renamer-Setup-*.exe).FullName
          $folder = "C:\Tools\MusicRenamerTest"
          $cli = "$folder\cli"
          function Install($arguments) {
            $run = Start-Process $setup -ArgumentList (@("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$folder") + $arguments) -Wait -PassThru
            if ($run.ExitCode -ne 0) { throw "Setup fehlgeschlagen: $($run.ExitCode)" }
          }
          function OnPath { [Environment]::GetEnvironmentVariable("Path", "User") -split ";" -contains $cli }

          Install @()
          if ((Test-Path $cli) -or (OnPath)) { throw "Befehlszeile ohne Auswahl installiert" }
          Install @("/TASKS=cli")
          if (-not (OnPath)) { throw "Befehlszeile fehlt im Pfad" }
          & "$cli\music-renamer-cli.exe" --selftest
          if ($LASTEXITCODE -ne 0) { throw "Installierte Befehlszeile fehlgeschlagen" }
          # So ruft die Update-Funktion das Setup auf, die Auswahl muss bleiben
          Install @()
          if (-not (Test-Path "$cli\music-renamer-cli.exe") -or -not (OnPath)) { throw "Update hat die Befehlszeile entfernt" }
          Install @("/MERGETASKS=!cli")
          if ((Test-Path $cli) -or (OnPath)) { throw "Abwählen hat die Befehlszeile nicht entfernt" }
          Install @("/TASKS=cli")

          Start-Process "$folder\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES" -Wait
          for ($i = 0; $i -lt 30 -and (Test-Path "$cli\music-renamer-cli.exe"); $i++) { Start-Sleep 1 }
          if ((Test-Path "$cli\music-renamer-cli.exe") -or (OnPath)) { throw "Deinstallation unvollständig" }

      - name: Kopie unter altem Namen
        shell: pwsh
        run: |
          # Versionen bis 0.5.0 erkennen ihr Update nur am alten Dateinamen
          $version = "${{ steps.version.outputs.version }}"
          Copy-Item "dist\Music-Renamer-Setup-$version.exe" "dist\MP3-Organizer-Setup-$version.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.sha256

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            name: arm64
            python: "3.14"
          # tkinterdnd2 hat für Intel-Macs nur einen Baustein für Tcl 8, Python 3.14 nutzt Tcl 9
          - runner: macos-15-intel
            name: intel
            python: "3.13"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Abhängigkeiten
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Tests
        run: python -m unittest discover -s tests

      - name: fpcalc holen
        run: |
          gh release download v1.5.1 --repo acoustid/chromaprint --pattern "chromaprint-fpcalc-1.5.1-macos-universal.tar.gz" --output fpcalc.tar.gz
          mkdir -p tools fpcalc
          tar xzf fpcalc.tar.gz -C fpcalc
          find fpcalc -name fpcalc -type f -exec cp {} tools/ \;
          chmod +x tools/fpcalc
        env:
          GH_TOKEN: ${{ github.token }}

      - name: App und Disk-Image bauen
        run: bash installer/build_mac.sh

      - name: Fertiges Paket prüfen
        run: |
          app="dist/Music Renamer.app/Contents/MacOS/Music Renamer"
          "$app" --selftest
          vtool -show-build "$app" | grep -E 'minos|version' || otool -l "$app" | grep -A3 LC_VERSION_MIN
          "$app" & pid=$!
          sleep 15
          screencapture -x dist/fenster.png || true
          kill -0 "$pid"
          kill "$pid"
          hdiutil attach dist/*.dmg -nobrowse -mountpoint /tmp/image
          "/tmp/image/Music Renamer.app/Contents/MacOS/Music Renamer" --selftest
          test -L /tmp/image/Applications
          hdiutil detach /tmp/image

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.sha256
            dist/fenster.png

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Das älteste Ubuntu legt die nötige glibc fest: Debian 12 und neuer
          - runner: ubuntu-22.04
            name: amd64
          - runner: ubuntu-22.04-arm
            name: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Abhängigkeiten
        run: |
          sudo apt-get update
          sudo apt-get install -y tk8.6 xvfb
          python -m pip install -r requirements.txt pyinstaller

      - name: Tests
        run: xvfb-run -a python -m unittest discover -s tests

      - name: fpcalc holen
        if: matrix.name == 'amd64'
        run: |
          gh release download v1.5.1 --repo acoustid/chromaprint --pattern "chromaprint-fpcalc-1.5.1-linux-x86_64.tar.gz" --output fpcalc.tar.gz
          mkdir -p tools fpcalc
          tar xzf fpcalc.tar.gz -C fpcalc
          find fpcalc -name fpcalc -type f -exec cp {} tools/ \;
          chmod +x tools/fpcalc
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Pakete bauen
        run: bash installer/build_deb.sh

      - name: In frischen Systemen installieren und prüfen
        run: |
          for image in debian:12 debian:13 ubuntu:22.04 ubuntu:24.04; do
            echo "::group::$image"
            docker run --rm -v "$PWD/dist:/pakete" -v "$PWD/installer:/skripte:ro" "$image" sh /skripte/check_deb.sh
            echo "::endgroup::"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-${{ matrix.name }}
          path: |
            dist/*.deb
            dist/*.sha256
            dist/fenster-linux-*.png

  publish:
    if: github.ref_type == 'tag'
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Release veröffentlichen
        run: |
          rm -f assets/fenster*.png
          # Jedes Release braucht alle Pakete: Fenster für alle drei Systeme, Befehlszeile für Windows
          # (im Setup, oben geprüft) und Linux. Die Kopie unter altem Namen brauchen Updates bis 0.5.0.
          version="${GITHUB_REF_NAME#v}"
          for file in "Music-Renamer-Setup-$version.exe" "MP3-Organizer-Setup-$version.exe" \
              "Music-Renamer-$version-macOS-arm64.dmg" "Music-Renamer-$version-macOS-intel.dmg" \
              "music-renamer_${version}_amd64.deb" "music-renamer_${version}_arm64.deb" \
              "music-renamer-cli_${version}_amd64.deb" "music-renamer-cli_${version}_arm64.deb"; do
            test -f "assets/$file" || { echo "::error::Es fehlt $file"; exit 1; }
          done
          gh release create "$GITHUB_REF_NAME" assets/* --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
