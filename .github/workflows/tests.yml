name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements.txt
      # Für die Prüfung mit echten Audiodateien in tests/test_real_audio.py
      - name: ffmpeg und fpcalc holen
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          gh release download v1.5.1 --repo acoustid/chromaprint --pattern "chromaprint-fpcalc-1.5.1-windows-x86_64.zip" --output fpcalc.zip
          Expand-Archive fpcalc.zip fpcalc
          New-Item -ItemType Directory -Force tools | Out-Null
          Get-ChildItem fpcalc -Recurse -Filter fpcalc.exe | Copy-Item -Destination tools\
        env:
          GH_TOKEN: ${{ github.token }}
      - run: python -m unittest discover -s tests -v
